name: CI

# main = production, qa = testing environment.
on:
  push:
    branches: [main, qa]
  pull_request:
    branches: [main, qa]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Syntax-check every source file (no API key needed, never calls OpenAI).
      - run: |
          for f in src/*.js; do node --check "$f"; done

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for OIDC — no AWS keys stored in GitHub
      contents: read
    environment: ${{ github.ref_name == 'main' && 'production' || 'qa' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: Package
        run: zip -rq function.zip src node_modules package.json
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: us-east-1
      - name: Deploy code to Lambda
        run: |
          FN=${{ github.ref_name == 'main' && 'hnavas-agent-api' || 'hnavas-agent-api-qa' }}
          aws lambda update-function-code --function-name "$FN" --zip-file fileb://function.zip --publish
      # NOTE: we deploy CODE only. OPENAI_API_KEY + ALLOWED_ORIGINS live in each
      # Lambda's own environment (set once, per environment) — the deploy role
      # cannot read or change them, so the key never touches GitHub or CI.
