name: CI

# main = production, qa = testing environment.
on:
  push:
    branches: [main, qa]
  pull_request:
    branches: [main, qa]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Syntax-check every source file (no API key needed, never calls OpenAI).
      - run: |
          for f in src/*.js; do node --check "$f"; done

